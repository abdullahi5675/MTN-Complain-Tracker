{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}MTN Complaint Portal{% endblock %}</title>
    <!-- <link rel="stylesheet" href="{% static 'styles.css' %}"> -->  <!-- disable old css -->
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #FFF9E5; /* soft MTN yellow background */
        }

        /* ===== Header ===== */
        header {
            background-color: #000000; /* MTN black */
            color: #FFCC00; /* MTN yellow */
            text-align: center;
            padding: 25px 0 15px 0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: bold;
        }

        /* ===== Navigation ===== */
        nav {
            background-color: #FFCC00; /* yellow bar */
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 12px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        nav a {
            color: #000;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: color 0.3s ease;
        }
        nav a:hover {
            color: #ffffff;
        }

        .badge {
            background-color: red;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            vertical-align: super;
        }

        /* ===== Main Content ===== */
        main {
            padding: 20px;
        }

        /* ===== Footer ===== */
        footer {
            background-color: #000000;
            color: #FFCC00;
            text-align: center;
            padding: 15px 0;
            font-size: 14px;
            margin-top: 40px;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to MTN Complaints Portal</h1>
    </header>

    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'my_complaints' %}">My Complaints {% if complaint_count %}<span class="badge">{{ complaint_count }}</span>{% endif %}</a>
        <a href="{% url 'logout' %}">Logout</a>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; {% now "Y" %} MTN Nigeria Customer Complaint System</p>
    </footer>
</body>
</html>
