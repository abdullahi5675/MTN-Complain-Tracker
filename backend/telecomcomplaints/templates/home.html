{% extends 'base.html' %}

{% block title %}MTN Complaint Portal{% endblock %}

{% block content %}

<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background-color: #FFF8DC;
        /* light yellow tint */
        margin: 0;
        padding: 0;
    }

    /* ===== Header ===== */
    .header {
        background-color: #000000;
        /* MTN black */
        color: #FFCC00;
        /* MTN yellow */
        text-align: center;
        padding: 18px 0;
        font-size: 26px;
        font-weight: bold;
        letter-spacing: 1px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    /* ===== Container ===== */
    .container {
        background: #FFFFFF;
        max-width: 480px;
        margin: 40px auto;
        padding: 35px 40px;
        border-radius: 12px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        border-top: 8px solid #FFCC00;
    }

    h2 {
        color: #000;
        text-align: center;
        margin-bottom: 25px;
        font-size: 22px;
        font-weight: bold;
    }

    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
        color: #333;
    }

    input,
    select,
    textarea {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
        background-color: #f9f9f9;
        transition: all 0.3s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
        border-color: #FFCC00;
        outline: none;
        box-shadow: 0 0 6px rgba(255, 204, 0, 0.6);
    }

    textarea {
        resize: vertical;
    }

    /* ===== Button ===== */
    button {
        background-color: #FFCC00;
        /* MTN yellow */
        color: #000000;
        font-weight: bold;
        padding: 12px 20px;
        margin-top: 25px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        width: 100%;
        transition: background-color 0.3s ease;
    }

    button:hover {
        background-color: #e6b800;
        /* darker yellow */
    }

    /* ===== Footer ===== */
    .footer {
        text-align: center;
        padding: 25px 10px;
        color: #333;
        font-size: 14px;
        background-color: #000000;
        color: #FFCC00;
        margin-top: 50px;
        box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.2);
    }
</style>

<div class="header">
    MTN Customer Complaint Form
</div>

<div class="container">
    <h2>Submit Your Complaint, {{ user.first_name }}</h2>

    <form method="post" action="{% url 'submit_complaint' %}" autocomplete="off">
        {% csrf_token %}

        <label for="email">Email:</label>
        <input type="email" name="email" id="email" value="{{ user.email }}" readonly required>

        <label for="service_type">Service Type:</label>
        <select name="service_type" id="service_type" required>
            <option value="">-- Select Complaint Type --</option>
            <option value="Call Drop">Call Drop</option>
            <option value="Slow Internet">Slow Internet</option>
            <option value="SMS Failure">SMS Failure</option>
            <option value="No Network">No Network</option>
        </select>

        <label for="description">Description:</label>
        <textarea name="description" id="description" rows="5" required></textarea>

        <label for="phone_number">Phone Number:</label>
        <input type="text" name="phone_number" id="phone_number" required>

        <input type="hidden" name="latitude" id="latitude">
        <input type="hidden" name="longitude" id="longitude">

        <button type="submit">Submit Complaint</button>
    </form>
</div>



<script>
    // Prevent restoring form data when going back
    if (window.history.replaceState) {
        window.history.replaceState(null, null, window.location.href);
    }

    // Capture location on load
    window.onload = function () {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function (pos) {
                document.getElementById("latitude").value = pos.coords.latitude;
                document.getElementById("longitude").value = pos.coords.longitude;
            }, function (err) {
                console.error("Location Error:", err.message);
            });
        }
    };
</script>

{% endblock %}
